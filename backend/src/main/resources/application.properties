# Server Configuration - Railway compatible
server.port=${PORT:8080}

# Database Configuration - PostgreSQL for Production, H2 for Development
# Managed by DatabaseConfig.java bean which handles Railway DATABASE_URL transformation
# Database connection handled by @Bean DataSource in DatabaseConfig.java

# JPA Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
