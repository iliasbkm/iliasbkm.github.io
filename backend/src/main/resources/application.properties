server.port=${PORT:8080}

# PostgreSQL Database Configuration
# Spring Boot reads environment variables with SPRING_ prefix
# Example: SPRING_DATASOURCE_URL=jdbc:postgresql://...
spring.datasource.url=jdbc:postgresql://ep-still-dawn-agxuv65v.c-2.eu-central-1.pg.koyeb.app:5432/koyebdb
spring.datasource.username=koyeb-adm
spring.datasource.password=npg_9eGhHSV2gQFl
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
