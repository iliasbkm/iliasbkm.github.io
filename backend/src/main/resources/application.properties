# Server Configuration - Railway compatible
server.port=${PORT:8080}

# Database Configuration - PostgreSQL for Production, H2 for Development
# Railway provides DATABASE_URL in format postgresql://user:pass@host:port/db
# We need to add jdbc: prefix for Spring Boot
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:binetdb}}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
