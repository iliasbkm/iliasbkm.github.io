# Production Profile - PostgreSQL on Railway
server.port=${PORT:8080}

# Railway provides PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE separately
# Use them to build the JDBC URL correctly
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
